<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bookings | Freddie Fierce</title>

    <meta
        name="description"
        content="Booking enquiries for UK hard house DJ and producer Freddie Fierce."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >

    <link
        rel="stylesheet"
        href="bookings.css"
    >

</head>


<body>

    <main class="bookingPage">

        <div class="bookingContent">


            <!-- LOGO -->

            <img
                src="assets/images/fiercelogo.png"
                alt="Freddie Fierce"
                class="bookingLogo"
            >


            <!-- HEADING -->

            <p class="bookingTitle">
                BOOKINGS / ENQUIRIES
            </p>


            <!-- INTRO -->

            <p class="bookingIntro">
                For bookings, appearances and event enquiries,
                please use the form below.
            </p>


            <!-- BOOKING FORM -->

            <form
    class="bookingForm"
    id="bookingForm"
    action="/api/booking"
    method="POST"
>

                <div class="formGroup">

                    <label for="name">
                        NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <div class="formGroup">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="formGroup">

                    <label for="event">
                        EVENT / ORGANISATION
                    </label>

                    <input
                        type="text"
                        id="event"
                        name="event"
                    >

                </div>


                <div class="formGroup">

                    <label for="date">
                        EVENT DATE
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                </div>


                <div class="formGroup">

                    <label for="location">
                        LOCATION
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                    >

                </div>


                <div class="formGroup">

                    <label for="message">
                        MESSAGE
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="sendButton"
                >
                    SEND ENQUIRY
                </button>

            </form>


            <!-- DIRECT EMAIL -->

            <div class="directContact">

                <span>DIRECT:</span>

                <a href="mailto:bookings@freddiefierce.com">
                    bookings@freddiefierce.com
                </a>

            </div>


            <!-- RETURN -->

            <a
                href="index.html"
                class="returnLink"
            >
                [ RETURN ]
            </a>


        </div>

    </main>

</body>

</html>
