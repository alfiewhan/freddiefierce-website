<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bookings | Freddie Fierce</title>

    <meta
        name="description"
        content="Booking enquiries for UK hard house DJ and producer Freddie Fierce."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/favicon.png"
    >

    <link
        rel="stylesheet"
        href="bookings.css"
    >

</head>


<body>

    <main class="bookingPage">

        <div class="bookingContent">


            <!-- =========================
                 LOGO
            ========================== -->

            <img
                src="assets/images/fiercelogo.png"
                alt="Freddie Fierce"
                class="bookingLogo"
            >


            <!-- =========================
                 HEADING
            ========================== -->

            <p class="bookingTitle">
                BOOKINGS / ENQUIRIES
            </p>


            <p class="bookingIntro">
                For bookings, appearances and event enquiries,
                please use the form below.
            </p>


            <!-- =========================
                 BOOKING FORM
            ========================== -->

            <form
                class="bookingForm"
                id="bookingForm"
                action="/api/booking"
                method="POST"
            >


                <!-- NAME -->

                <div class="formGroup">

                    <label for="name">
                        NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="formGroup">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <!-- EVENT -->

                <div class="formGroup">

                    <label for="event">
                        EVENT / ORGANISATION
                    </label>

                    <input
                        type="text"
                        id="event"
                        name="event"
                    >

                </div>


                <!-- DATE -->

                <div class="formGroup">

                    <label for="date">
                        EVENT DATE
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                    >

                </div>


                <!-- LOCATION -->

                <div class="formGroup">

                    <label for="location">
                        LOCATION
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                    >

                </div>


                <!-- MESSAGE -->

                <div class="formGroup">

                    <label for="message">
                        MESSAGE
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                </div>


                <!-- SEND -->

                <button
                    type="submit"
                    class="sendButton"
                >
                    SEND ENQUIRY
                </button>


            </form>


            <!-- =========================
                 SUCCESS MESSAGE
            ========================== -->

            <div
                id="formSuccess"
                class="formMessage"
            >

                <p class="successTitle">
                    ENQUIRY SENT
                </p>

                <p>
                    Thank you. Your message has been received.
                </p>

            </div>


            <!-- =========================
                 ERROR MESSAGE
            ========================== -->

            <div
                id="formError"
                class="formMessage"
            >

                <p class="errorTitle">
                    MESSAGE NOT SENT
                </p>

                <p>
                    Please try again or email
                    bookings@freddiefierce.com directly.
                </p>

            </div>


            <!-- =========================
                 DIRECT EMAIL
            ========================== -->

            <div class="directContact">

                <span>
                    DIRECT:
                </span>

                <a href="mailto:bookings@freddiefierce.com">
                    bookings@freddiefierce.com
                </a>

            </div>


            <!-- =========================
                 RETURN
            ========================== -->

            <a
                href="index.html"
                class="returnLink"
            >
                [ RETURN ]
            </a>


        </div>

    </main>



    <!-- =========================
         BOOKING FORM JAVASCRIPT
    ========================== -->

    <script>

        const bookingForm =
            document.getElementById("bookingForm");

        const formSuccess =
            document.getElementById("formSuccess");

        const formError =
            document.getElementById("formError");

        const sendButton =
            bookingForm.querySelector(".sendButton");


        bookingForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // Hide old messages

                formSuccess.classList.remove("visible");
                formError.classList.remove("visible");


                // Prevent double submissions

                sendButton.disabled = true;
                sendButton.textContent = "SENDING...";


                try {

                    const formData =
                        new FormData(bookingForm);


                    const response =
                        await fetch(
                            "/api/booking",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            "Booking enquiry failed"
                        );

                    }


                    // Clear the form

                    bookingForm.reset();


                    // Update button

                    sendButton.textContent =
                        "SENT";


                    // Show confirmation

                    formSuccess.classList.add(
                        "visible"
                    );

                }


                catch (error) {

                    console.error(error);


                    // Allow another attempt

                    sendButton.disabled = false;

                    sendButton.textContent =
                        "SEND ENQUIRY";


                    // Show error

                    formError.classList.add(
                        "visible"
                    );

                }

            }
        );

    </script>


</body>

</html>
