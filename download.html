<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Download — Freddie Fierce</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;

            background: #050505;
            color: #d7d7d7;

            font-family: "Courier New", Courier, monospace;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 255, 255, 0.04) 0,
                    rgba(255, 255, 255, 0.04) 1px,
                    rgba(0, 0, 0, 0.18) 2px,
                    rgba(0, 0, 0, 0.18) 4px
                );

            opacity: 0.8;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 21;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 45%,
                    rgba(0, 0, 0, 0.5) 78%,
                    rgba(0, 0, 0, 0.92) 100%
                );
        }

        .download-terminal {
            position: relative;
            z-index: 2;

            width: min(680px, 100%);
            padding: 40px 34px;

            border: 1px solid #777;
            background: #0a0a0a;

            box-shadow:
                inset 0 0 35px rgba(255, 255, 255, 0.025),
                0 0 0 1px #111;

            animation: terminalFlicker 5s infinite;
        }

        .download-terminal::before {
            content: "";
            position: absolute;
            inset: 8px;
            pointer-events: none;
            border: 1px solid #222;
        }

        h1 {
            margin: 0 0 28px;

            color: #efefef;

            font-size: clamp(22px, 5vw, 34px);
            font-weight: normal;
            letter-spacing: 5px;

            text-shadow: 1px 0 #666;
        }

        .progress-frame {
            width: 100%;
            height: 24px;

            margin: 28px 0;
            padding: 3px;

            border: 1px solid #999;
            background: #020202;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background:
                repeating-linear-gradient(
                    90deg,
                    #d0d0d0 0,
                    #d0d0d0 10px,
                    #555 10px,
                    #555 13px
                );

            transition: width 0.45s steps(8, end);
        }

        .status-message {
            min-height: 52px;
            margin: 0;

            color: #d0d0d0;

            font-size: clamp(14px, 2.5vw, 17px);
            line-height: 1.7;
            letter-spacing: 1px;
        }

        .small-message {
            margin-top: 24px;

            color: #777;

            font-size: 12px;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .return-link {
            display: none;
            margin-top: 22px;

            color: #dcdcdc;
            text-decoration: underline;
        }

        .error {
            color: #cfcfcf;
        }

        @keyframes terminalFlicker {
            0%,
            18%,
            22%,
            62%,
            64%,
            100% {
                opacity: 1;
            }

            20% {
                opacity: 0.96;
            }

            63% {
                opacity: 0.93;
            }
        }
    </style>
</head>

<body>
    <main class="download-terminal">
        <h1>PAYMENT ACCEPTED</h1>

        <div class="progress-frame">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

        <p
            class="status-message"
            id="statusMessage"
        >
            INITIALISING SECURE CONNECTION...
        </p>

        <p class="small-message">
            DO NOT CLOSE THIS WINDOW.<br>
            YOUR DOWNLOAD WILL START AUTOMATICALLY.
        </p>

        <a
            href="music.html"
            class="return-link"
            id="returnLink"
        >
            RETURN TO MUSIC
        </a>
    </main>

    <script>
        const workerBase =
            "https://freddie-fierce-downloads.alfiewhitn.workers.dev";

        const progressBar =
            document.getElementById("progressBar");

        const statusMessage =
            document.getElementById("statusMessage");

        const returnLink =
            document.getElementById("returnLink");

        const sessionId =
            new URLSearchParams(window.location.search)
                .get("session_id");

        const stages = [
            {
                progress: 15,
                message: "> CONNECTING TO SERVER..."
            },
            {
                progress: 35,
                message: "> AUTHENTICATING PAYMENT..."
            },
            {
                progress: 55,
                message: "> LOCATING TRACK..."
            },
            {
                progress: 76,
                message: "> PREPARING DOWNLOAD..."
            },
            {
                progress: 100,
                message: "> DOWNLOAD STARTING..."
            }
        ];

        const delay = milliseconds =>
            new Promise(resolve =>
                setTimeout(resolve, milliseconds)
            );

        async function beginDownload() {
            if (
                !sessionId ||
                !sessionId.startsWith("cs_")
            ) {
                showError(
                    "INVALID PAYMENT SESSION. PLEASE RETURN TO THE MUSIC PAGE."
                );

                return;
            }

            for (const stage of stages) {
                progressBar.style.width =
                    `${stage.progress}%`;

                statusMessage.textContent =
                    stage.message;

                await delay(700);
            }

            const downloadUrl =
                `${workerBase}/download?session_id=` +
                encodeURIComponent(sessionId);

            window.location.href = downloadUrl;
        }

        function showError(message) {
            statusMessage.textContent = message;
            statusMessage.classList.add("error");

            progressBar.style.width = "0%";
            returnLink.style.display = "inline-block";
        }

        beginDownload();
    </script>
</body>
</html>
